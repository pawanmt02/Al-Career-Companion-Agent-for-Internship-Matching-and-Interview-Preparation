<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Resume Agent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand:{ 400:"#38bdf8", 500:"#0ea5e9", 600:"#0284c7", 700:"#0369a1", 900:"#0c4a6e" }
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { font-family:"Inter",sans-serif; box-sizing:border-box; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar{width:5px;height:5px}
    ::-webkit-scrollbar-track{background:#0f172a}
    ::-webkit-scrollbar-thumb{background:#334155;border-radius:9999px}
    ::-webkit-scrollbar-thumb:hover{background:#0ea5e9}

    /* ── Base ── */
    body { background:#030712; }

    /* ── Glassmorphism ── */
    .glass {
      background:rgba(255,255,255,0.04);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border:1px solid rgba(255,255,255,0.08);
    }
    .glass-hover { transition:all 0.3s ease; }
    .glass-hover:hover {
      background:rgba(255,255,255,0.07);
      border-color:rgba(14,165,233,0.35);
      transform:translateY(-2px);
      box-shadow:0 12px 40px rgba(14,165,233,0.1);
    }

    /* ── Gradient text ── */
    .gradient-text {
      background:linear-gradient(135deg,#38bdf8 0%,#a78bfa 50%,#f472b6 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
    }
    .gradient-text-gold {
      background:linear-gradient(135deg,#fbbf24,#f59e0b,#ef4444);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
    }

    /* ── Neon button ── */
    .btn-glow { position:relative; overflow:hidden; }
    .btn-glow::after {
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(135deg,rgba(255,255,255,0.12),transparent 60%);
      opacity:0;
      transition:opacity 0.3s;
    }
    .btn-glow:hover::after { opacity:1; }
    .btn-glow:hover { transform:translateY(-1px); }
    .btn-glow:active { transform:translateY(0); }

    /* ── Skill badge ── */
    .skill-badge {
      display:inline-block;padding:3px 11px;border-radius:9999px;
      font-size:0.7rem;font-weight:600;margin:2px;
      transition:all 0.2s;cursor:default;
    }
    .skill-badge:hover{transform:scale(1.1) translateY(-1px);}

    /* ── Floating orbs ── */
    @keyframes floatOrb {
      0%,100%{transform:translate(0,0) scale(1);}
      33%{transform:translate(30px,-40px) scale(1.05);}
      66%{transform:translate(-20px,20px) scale(0.95);}
    }
    .orb {
      position:fixed;border-radius:50%;
      filter:blur(90px);pointer-events:none;z-index:0;
    }
    .orb-1{
      width:600px;height:600px;
      background:radial-gradient(circle,rgba(2,132,199,0.18),transparent 70%);
      top:-200px;left:-150px;
      animation:floatOrb 12s ease-in-out infinite;
    }
    .orb-2{
      width:500px;height:500px;
      background:radial-gradient(circle,rgba(124,58,237,0.15),transparent 70%);
      bottom:-150px;right:-100px;
      animation:floatOrb 16s ease-in-out infinite reverse;
    }
    .orb-3{
      width:350px;height:350px;
      background:radial-gradient(circle,rgba(244,114,182,0.1),transparent 70%);
      top:45%;left:55%;
      animation:floatOrb 20s ease-in-out infinite 4s;
    }

    /* ── Grid overlay ── */
    .grid-bg {
      position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.4;
      background-image:
        linear-gradient(rgba(14,165,233,0.04) 1px,transparent 1px),
        linear-gradient(90deg,rgba(14,165,233,0.04) 1px,transparent 1px);
      background-size:60px 60px;
      mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black,transparent);
    }

    /* ── Noise texture ── */
    .noise::before {
      content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      opacity:0.15;
    }

    /* ── Card shine on hover ── */
    .card-shine {
      position:relative;overflow:hidden;
    }
    .card-shine::before {
      content:"";position:absolute;
      top:-50%;left:-50%;width:60%;height:200%;
      background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,0.05) 50%,transparent 60%);
      transform:translateX(-100%) rotate(15deg);
      transition:transform 0.6s ease;
      pointer-events:none;
    }
    .card-shine:hover::before { transform:translateX(350%) rotate(15deg); }

    /* ── Pulse ring ── */
    @keyframes pulseRing {
      0%{transform:scale(1);opacity:0.8;}
      100%{transform:scale(1.6);opacity:0;}
    }
    .pulse-ring::after {
      content:"";position:absolute;inset:0;border-radius:inherit;
      border:2px solid currentColor;animation:pulseRing 2s ease-out infinite;
    }

    /* ── Number counter ── */
    @keyframes countUp { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
    .count-in { animation:countUp 0.5s ease forwards; }

    /* ── Shimmer skeleton ── */
    .shimmer {
      background:linear-gradient(90deg,#1e293b 25%,#2d3f55 50%,#1e293b 75%);
      background-size:200% 100%;
      animation:shimmerAnim 1.8s infinite;
    }
    @keyframes shimmerAnim{0%{background-position:200% 0}100%{background-position:-200% 0}}

    /* ── Gradient border ── */
    .grad-border {
      position:relative;border-radius:1rem;
    }
    .grad-border::before {
      content:"";position:absolute;inset:-1px;border-radius:inherit;
      background:linear-gradient(135deg,rgba(14,165,233,0.5),rgba(124,58,237,0.4),rgba(244,114,182,0.3));
      z-index:-1;opacity:0;transition:opacity 0.3s;
    }
    .grad-border:hover::before { opacity:1; }
  </style>
  <script type="module" crossorigin src="/assets/index-DVwhAe9p.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen noise">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="grid-bg"></div>
  <div id="root" style="position:relative;z-index:1;"></div>
</body>
</html>
